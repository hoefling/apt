name: Import release into APT repo

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Upstream repository (hoefling/python3-magic-filter)"
        required: true
      tag:
        description: "Release tag (e.g. v1.0.12)"
        required: true

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout APT repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.APT_REPO_TOKEN }}

      - name: Download deb files from release
        uses: robinraju/release-downloader@v1
        with:
          repository: "${{ inputs.repo }}"
          tag: "${{ inputs.tag }}"
          fileName: '*.deb'
          out-file-path: 'pool/main'

      - name: Commit deb files
        run: |
          git config user.name "apt-release-bot"
          git config user.email "apt-release-bot@users.noreply.github.com"
          git add pool/main
          git diff --cached --quiet || ( \
            git commit -m "Import ${{ inputs.repo }}@${{ inputs.tag }}" \
            && git push origin main \
          )
