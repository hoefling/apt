name: Import release into APT repo

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Upstream repository (owner/name)"
        required: true
      tag:
        description: "Release tag (e.g. v1.2.0)"
        required: true

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout APT repo
        uses: actions/checkout@v4

      - name: Download deb files from release
        uses: robinraju/release-downloader@v1
        with:
          repository: "${{ inputs.repo }}"
          tag: "${{ inputs.tag }}"
          fileName: '*.deb'

      - name: Commit deb files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add pool
          git commit -m "Import ${{ inputs.repo }}@${{ inputs.tag }}"
          git push origin main
